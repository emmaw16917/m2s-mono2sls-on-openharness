AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Minimal Python workspace for verify.py's Python support (runtime, layer, coverage).
Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 512
Resources:
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/shared/
      CompatibleRuntimes: [python3.12]
    Metadata:
      BuildMethod: python3.12
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
  ItemsGet:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/items-get/
      Handler: handler.lambda_handler
      Layers: [!Ref SharedLayer]
      Environment:
        Variables:
          ITEMS_TABLE: !Ref ItemsTable
      Events:
        Get:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: "/items/{id}", Method: get, Auth: {Authorizer: NONE}}
  ItemsDeleteMany:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/items-delete-many/
      Handler: handler.lambda_handler
      Layers: [!Ref SharedLayer]
      Environment:
        Variables:
          ITEMS_TABLE: !Ref ItemsTable
      Events:
        Post:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: "/items/delete", Method: post, Auth: {Authorizer: NONE}}
